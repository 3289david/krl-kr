name: Deploy Email Worker

on:
  push:
    branches: [master]
    paths:
      - "worker/email-worker.ts"
      - "wrangler.email.toml"
      - ".github/workflows/deploy-email-worker.yml"

  workflow_dispatch: # allow manual trigger from GitHub Actions tab

jobs:
  deploy:
    name: Deploy krl-kr-email Worker
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci

      - name: Deploy email worker to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: npx wrangler deploy --config wrangler.email.toml

      - name: Set WORKER_SECRET
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          WORKER_SECRET: ${{ secrets.WORKER_SECRET }}
        run: |
          echo "$WORKER_SECRET" | npx wrangler secret put WORKER_SECRET --config wrangler.email.toml
