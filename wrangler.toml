# KRL.KR — Cloudflare Workers Configuration
#
# Workers 2개:
#   1. krl-kr-edge   — 선택적 URL 리다이렉트 속도 향상용 (메인 앱은 VPS)
#   2. krl-kr-email  — 이메일 수신함 필수 (*@mail.krl.kr)
#
# 배포 방법은 아래 README 참고

# ── Edge Redirect Worker (선택) ───────────────────────────────────────────────
name = "krl-kr-edge"
main = "worker/index.ts"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]

[vars]
APP_URL = "https://krl.kr"

# KV 네임스페이스 (edge worker 사용 시 필요, wrangler kv namespace create URL_CACHE)
# [[kv_namespaces]]
# binding = "URL_CACHE"
# id = "YOUR_KV_NAMESPACE_ID"

# ── Email Worker 별도 배포 ────────────────────────────────────────────────────
# wrangler deploy --config wrangler.email.toml
