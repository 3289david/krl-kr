# KRL.KR — Cloudflare Worker (Optional Edge Redirect Booster)
# This worker is OPTIONAL. The main app runs on VPS with Next.js.
# Deploy this only if you want ultra-fast edge redirects via Cloudflare network.
#
# Main app: VPS with Next.js (PostgreSQL + Redis + local storage)
# This worker: Edge redirect cache only (fetches from main app if cache miss)

name = "krl-kr-edge"
main = "worker/index.ts"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]

[vars]
APP_URL = "https://krl.kr"

# Only needed if deploying the edge worker:
# [[kv_namespaces]]
# binding = "URL_CACHE"
# id = "YOUR_KV_ID"
