# KRL.KR — Cloudflare Workers Configuration
#
# TWO workers in this project:
#
# 1. krl-kr-edge    — Optional URL redirect booster (main app on VPS)
# 2. krl-kr-email   — REQUIRED for email inbox feature (*@mail.krl.kr)
#
# Deploy email worker: wrangler deploy --config wrangler.email.toml
# Setup Cloudflare Email Routing: Email > Email Routing > add catch-all → this Worker

# ── Default (edge redirect worker) ──────────────────────────────────────────
name = "krl-kr-edge"
main = "worker/index.ts"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]

[vars]
APP_URL = "https://krl.kr"

# Only needed if deploying the edge worker:
# [[kv_namespaces]]
# binding = "URL_CACHE"
# id = "YOUR_KV_ID"

# ── Email Worker ─────────────────────────────────────────────────────────────
# Deploy separately: wrangler deploy --config wrangler.email.toml
