# KRL.KR — Edge Redirect Worker
#
# URL: https://krl-kr-edge.rukkit.workers.dev
#      https://krl.kr/* (production route)
#
# 배포:
#   wrangler deploy
#
# 시크릿 설정 (한 번만):
#   wrangler secret put WORKER_SECRET
#
# KV 네임스페이스 생성 (한 번만):
#   wrangler kv namespace create URL_CACHE
#   → 출력된 id를 아래 [[kv_namespaces]] id 에 넣으세요

name = "krl-kr-edge"
main = "worker/index.ts"
compatibility_date = "2024-11-01"
workers_dev = true

[vars]
APP_URL = "https://krl.kr"

# KV 캐시 — URL 리다이렉트 데이터를 엣지에 캐시 (60초 TTL)
# krl-kr-cache 워커와 동일한 네임스페이스를 공유합니다
[[kv_namespaces]]
binding = "URL_CACHE"
id = "3c7365988cf848cb84d012c855145e80"

# krl.kr 도메인의 슬러그 요청을 이 워커가 처리
[[routes]]
pattern = "krl.kr/*"
zone_name = "krl.kr"
